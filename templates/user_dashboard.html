<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tenant_name }} - Context Foundry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .space-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            cursor: default;
        }
        
        .space-selector::after {
            content: '▼';
            font-size: 0.7rem;
            color: #888;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #a0a0a0;
        }
        
        .logout-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        
        .search-container {
            margin-bottom: 1rem;
        }
        
        .search-form {
            display: flex;
            gap: 0.5rem;
        }
        
        .search-input {
            flex: 1;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        
        .search-input::placeholder {
            color: #666;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .search-results {
            min-height: 100px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            color: #888;
            display: none;
        }
        
        .search-results.visible {
            display: block;
        }
        
        .result-item {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .result-answer {
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        
        .result-confidence {
            font-size: 0.875rem;
            color: #667eea;
        }
        
        .result-sources {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.5rem;
        }
        
        .document-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .document-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .document-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .document-icon {
            font-size: 1.2rem;
        }
        
        .document-name {
            font-weight: 500;
            color: #fff;
        }
        
        .document-status {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        
        .status-extracted {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        
        .status-completed {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        
        .status-processing {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        
        .status-pending {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
        }
        
        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        .api-key-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 1rem;
            font-family: monospace;
        }
        
        .api-key-value {
            flex: 1;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .api-key-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-small {
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
        }
        
        .api-info {
            font-size: 0.875rem;
            color: #666;
            margin-top: 1rem;
            line-height: 1.5;
        }
        
        .upload-form {
            display: none;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .upload-form.visible {
            display: block;
        }
        
        .file-input-wrapper {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .file-input {
            flex: 1;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: #333;
            border-radius: 8px;
            color: #fff;
            display: none;
            z-index: 1000;
        }
        
        .toast.success {
            background: #10b981;
        }
        
        .toast.error {
            background: #ef4444;
        }
        
        .toast.visible {
            display: block;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="logo">Context Foundry</span>
            <div class="space-selector" id="spaceSelector">{{ tenant_name }}</div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span>{{ user_name }}</span>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </header>
    
    <main class="main-content">
        <section class="section">
            <h2 class="section-title">Search your knowledge</h2>
            <div class="search-container">
                <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                    <input type="text" class="search-input" id="searchQuery" 
                           placeholder="Ask a question about your documents..." 
                           autocomplete="off">
                    <button type="submit" class="btn" id="searchBtn">Search</button>
                </form>
            </div>
            <div class="search-results" id="searchResults">
                <div class="empty-state">Search results will appear here</div>
            </div>
        </section>
        
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Documents</h2>
                <button class="btn btn-secondary" onclick="toggleUpload()">Upload</button>
            </div>
            
            <div class="upload-form" id="uploadForm">
                <form onsubmit="handleUpload(event)">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" class="file-input" 
                               accept=".pdf,.doc,.docx,.txt,.md,.json">
                        <button type="submit" class="btn" id="uploadBtn">Upload File</button>
                    </div>
                </form>
            </div>
            
            <div class="document-list" id="documentList">
                <div class="empty-state">Loading documents...</div>
            </div>
        </section>
        
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">API Access</h2>
                <button class="btn btn-secondary btn-small" onclick="createApiKey()">Create New Key</button>
            </div>
            
            <div id="apiKeysList">
                <div class="empty-state">Loading API keys...</div>
            </div>
            
            <p class="api-info">
                Use your API key with Claude, ChatGPT, or any MCP-compatible AI agent to give them access to your knowledge space.
            </p>
        </section>
    </main>
    
    <div class="toast" id="toast"></div>
    
    <script>
        const tenantId = '{{ tenant_id }}';
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast visible ' + type;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }
        
        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;
            
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('searchResults');
            
            btn.innerHTML = '<span class="loading"></span>';
            btn.disabled = true;
            results.classList.add('visible');
            results.innerHTML = '<div class="empty-state">Searching...</div>';
            
            try {
                const response = await fetch('/dashboard/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.answer) {
                        results.innerHTML = `
                            <div class="result-item">
                                <div class="result-answer">${escapeHtml(data.answer)}</div>
                                <div class="result-confidence">Confidence: ${Math.round((data.confidence || 0) * 100)}%</div>
                                ${data.sources && data.sources.length ? `<div class="result-sources">Sources: ${data.sources.map(s => escapeHtml(s)).join(', ')}</div>` : ''}
                            </div>
                        `;
                    } else {
                        results.innerHTML = '<div class="empty-state">No results found for your query.</div>';
                    }
                } else {
                    results.innerHTML = `<div class="empty-state">Error: ${escapeHtml(data.error || 'Search failed')}</div>`;
                }
            } catch (err) {
                results.innerHTML = '<div class="empty-state">Search failed. Please try again.</div>';
            } finally {
                btn.innerHTML = 'Search';
                btn.disabled = false;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function toggleUpload() {
            const form = document.getElementById('uploadForm');
            form.classList.toggle('visible');
        }
        
        async function handleUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Please select a file', 'error');
                return;
            }
            
            const btn = document.getElementById('uploadBtn');
            btn.innerHTML = '<span class="loading"></span>';
            btn.disabled = true;
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch('/dashboard/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('Document uploaded successfully', 'success');
                    document.getElementById('uploadForm').classList.remove('visible');
                    fileInput.value = '';
                    loadDocuments();
                } else {
                    showToast(data.error || 'Upload failed', 'error');
                }
            } catch (err) {
                showToast('Upload failed. Please try again.', 'error');
            } finally {
                btn.innerHTML = 'Upload File';
                btn.disabled = false;
            }
        }
        
        async function loadDocuments() {
            const list = document.getElementById('documentList');
            
            try {
                const response = await fetch('/dashboard/documents');
                const data = await response.json();
                
                if (data.success && data.documents && data.documents.length > 0) {
                    list.innerHTML = data.documents.map(doc => `
                        <div class="document-item">
                            <div class="document-info">
                                <span class="document-icon">📄</span>
                                <span class="document-name">${escapeHtml(doc.name || doc.original_filename || 'Unknown')}</span>
                            </div>
                            <span class="document-status status-${doc.status || 'pending'}">${formatStatus(doc.status)}</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">No documents yet. Upload your first document to get started.</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="empty-state">Failed to load documents.</div>';
            }
        }
        
        function formatStatus(status) {
            const statusMap = {
                'extracted': '✅ Extracted',
                'completed': '✅ Extracted',
                'processing': '⏳ Processing',
                'pending': '⏳ Pending',
                'failed': '❌ Failed'
            };
            return statusMap[status] || status || 'Pending';
        }
        
        async function loadApiKeys() {
            const list = document.getElementById('apiKeysList');
            
            try {
                const response = await fetch('/dashboard/api-keys');
                const data = await response.json();
                
                if (data.success && data.keys && data.keys.length > 0) {
                    list.innerHTML = data.keys.map(key => `
                        <div class="api-key-display">
                            <span class="api-key-value">${escapeHtml(key.key_prefix || key.name)}••••••••</span>
                            <div class="api-key-actions">
                                <button class="btn btn-secondary btn-small" onclick="revokeKey('${key.id}')">Revoke</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">No API keys. Create one to give AI agents access.</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="empty-state">Failed to load API keys.</div>';
            }
        }
        
        async function createApiKey() {
            try {
                const response = await fetch('/dashboard/api-keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: 'Dashboard Key', scopes: ['read', 'write'] })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('API key created! Copy it now - it won\'t be shown again.', 'success');
                    alert('Your new API key (copy it now, it won\'t be shown again):\n\n' + data.api_key);
                    loadApiKeys();
                } else {
                    showToast(data.error || 'Failed to create key', 'error');
                }
            } catch (err) {
                showToast('Failed to create API key', 'error');
            }
        }
        
        async function revokeKey(keyId) {
            if (!confirm('Are you sure you want to revoke this API key?')) return;
            
            try {
                const response = await fetch(`/dashboard/api-keys/${keyId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('API key revoked', 'success');
                    loadApiKeys();
                } else {
                    showToast(data.error || 'Failed to revoke key', 'error');
                }
            } catch (err) {
                showToast('Failed to revoke API key', 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
            loadApiKeys();
        });
    </script>
</body>
</html>
