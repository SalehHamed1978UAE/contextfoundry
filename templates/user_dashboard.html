<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tenant_name }} - Context Foundry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            font-size: 16px;
        }
        
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 0.5rem;
        }
        
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .user-name {
            font-size: 0.875rem;
            color: #a0a0a0;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .logout-btn {
            padding: 0.4rem 0.75rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .space-bar {
            width: 100%;
            padding: 0.5rem 1rem;
            background: rgba(102, 126, 234, 0.1);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            font-size: 0.8rem;
            color: #667eea;
        }
        
        .main-content {
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .section-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }
        
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }
        
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .search-input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        
        .search-input::placeholder {
            color: #666;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .btn-small {
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
        }
        
        .search-results {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: none;
        }
        
        .search-results.visible {
            display: block;
        }
        
        .result-item {
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        .result-answer {
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.5;
            font-size: 0.9rem;
        }
        
        .result-confidence {
            font-size: 0.8rem;
            color: #667eea;
        }
        
        .result-sources {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
        }
        
        .document-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .document-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            gap: 0.5rem;
        }
        
        .document-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
            flex: 1;
        }
        
        .document-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .document-name {
            font-weight: 500;
            color: #fff;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .document-status {
            font-size: 0.7rem;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            flex-shrink: 0;
        }
        
        .status-extracted, .status-completed {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        
        .status-processing {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        
        .status-pending {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
        }
        
        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .empty-state {
            text-align: center;
            padding: 1.5rem 1rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        .api-key-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .api-key-value {
            flex: 1;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 100px;
        }
        
        .api-info {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.75rem;
            line-height: 1.4;
        }
        
        .upload-form {
            display: none;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        
        .upload-form.visible {
            display: block;
        }
        
        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .file-input {
            font-size: 0.85rem;
            color: #a0a0a0;
        }
        
        .file-input::file-selector-button {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            padding: 0.75rem 1rem;
            background: #333;
            border-radius: 8px;
            color: #fff;
            display: none;
            z-index: 1000;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .toast.success {
            background: #10b981;
        }
        
        .toast.error {
            background: #ef4444;
        }
        
        .toast.visible {
            display: block;
        }
        
        @media (min-width: 480px) {
            .search-form {
                flex-direction: row;
            }
            
            .search-input {
                flex: 1;
            }
            
            .file-input-wrapper {
                flex-direction: row;
                align-items: center;
            }
            
            .toast {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                max-width: 400px;
            }
        }
        
        @media (min-width: 768px) {
            .header {
                padding: 1rem 2rem;
            }
            
            .logo {
                font-size: 1.5rem;
            }
            
            .main-content {
                padding: 1.5rem;
            }
            
            .section {
                padding: 1.25rem;
            }
            
            .user-name {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <span class="logo">Context Foundry</span>
        <div class="header-right">
            <span class="user-name">{{ user_name }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </header>
    
    <div class="space-bar">{{ tenant_name }}</div>
    
    <main class="main-content">
        <section class="section">
            <h2 class="section-title">Search your knowledge</h2>
            <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                <input type="text" class="search-input" id="searchQuery" 
                       placeholder="Ask a question..." 
                       autocomplete="off">
                <button type="submit" class="btn" id="searchBtn">Search</button>
            </form>
            <div class="search-results" id="searchResults">
                <div class="empty-state">Results will appear here</div>
            </div>
        </section>
        
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Documents</h2>
                <button class="btn btn-secondary btn-small" onclick="toggleUpload()">Upload</button>
            </div>
            
            <div class="upload-form" id="uploadForm">
                <form onsubmit="handleUpload(event)">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" class="file-input" 
                               accept=".pdf,.doc,.docx,.txt,.md,.json">
                        <button type="submit" class="btn btn-small" id="uploadBtn">Upload</button>
                    </div>
                </form>
            </div>
            
            <div class="document-list" id="documentList">
                <div class="empty-state">Loading...</div>
            </div>
        </section>
        
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">API Access</h2>
                <button class="btn btn-secondary btn-small" onclick="createApiKey()">New Key</button>
            </div>
            
            <div id="apiKeysList">
                <div class="empty-state">Loading...</div>
            </div>
            
            <p class="api-info">
                Use API keys with Claude, ChatGPT, or any MCP-compatible AI agent.
            </p>
        </section>
    </main>
    
    <div class="toast" id="toast"></div>
    
    <script>
        const tenantId = '{{ tenant_id }}';
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast visible ' + type;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;
            
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('searchResults');
            
            btn.innerHTML = '<span class="loading"></span>';
            btn.disabled = true;
            results.classList.add('visible');
            results.innerHTML = '<div class="empty-state">Searching...</div>';
            
            try {
                const response = await fetch('/dashboard/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.answer) {
                        results.innerHTML = `
                            <div class="result-item">
                                <div class="result-answer">${escapeHtml(data.answer)}</div>
                                <div class="result-confidence">Confidence: ${Math.round((data.confidence || 0) * 100)}%</div>
                                ${data.sources && data.sources.length ? `<div class="result-sources">Sources: ${data.sources.map(s => escapeHtml(s)).join(', ')}</div>` : ''}
                            </div>
                        `;
                    } else {
                        results.innerHTML = '<div class="empty-state">No results found.</div>';
                    }
                } else {
                    results.innerHTML = `<div class="empty-state">${escapeHtml(data.error || 'Search failed')}</div>`;
                }
            } catch (err) {
                results.innerHTML = '<div class="empty-state">Search failed.</div>';
            } finally {
                btn.innerHTML = 'Search';
                btn.disabled = false;
            }
        }
        
        function toggleUpload() {
            document.getElementById('uploadForm').classList.toggle('visible');
        }
        
        async function handleUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Select a file', 'error');
                return;
            }
            
            const btn = document.getElementById('uploadBtn');
            btn.innerHTML = '<span class="loading"></span>';
            btn.disabled = true;
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch('/dashboard/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('Uploaded!', 'success');
                    document.getElementById('uploadForm').classList.remove('visible');
                    fileInput.value = '';
                    loadDocuments();
                } else {
                    showToast(data.error || 'Upload failed', 'error');
                }
            } catch (err) {
                showToast('Upload failed', 'error');
            } finally {
                btn.innerHTML = 'Upload';
                btn.disabled = false;
            }
        }
        
        async function loadDocuments() {
            const list = document.getElementById('documentList');
            
            try {
                const response = await fetch('/dashboard/documents');
                const data = await response.json();
                
                if (data.success && data.documents && data.documents.length > 0) {
                    list.innerHTML = data.documents.map(doc => `
                        <div class="document-item">
                            <div class="document-info">
                                <span class="document-icon">📄</span>
                                <span class="document-name">${escapeHtml(doc.name || 'Unknown')}</span>
                            </div>
                            <span class="document-status status-${doc.status || 'pending'}">${formatStatus(doc.status)}</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">No documents yet. Upload your first!</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="empty-state">Failed to load documents.</div>';
            }
        }
        
        function formatStatus(status) {
            const map = {
                'extracted': 'Done',
                'completed': 'Done',
                'processing': 'Processing',
                'pending': 'Pending',
                'failed': 'Failed'
            };
            return map[status] || status || 'Pending';
        }
        
        async function loadApiKeys() {
            const list = document.getElementById('apiKeysList');
            
            try {
                const response = await fetch('/dashboard/api-keys');
                const data = await response.json();
                
                if (data.success && data.keys && data.keys.length > 0) {
                    list.innerHTML = data.keys.map(key => `
                        <div class="api-key-item">
                            <span class="api-key-value">${escapeHtml(key.key_prefix || key.name)}...</span>
                            <button class="btn btn-secondary btn-small" onclick="revokeKey('${key.id}')">Revoke</button>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">No API keys yet.</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="empty-state">Failed to load keys.</div>';
            }
        }
        
        async function createApiKey() {
            try {
                const response = await fetch('/dashboard/api-keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: 'Dashboard Key', scopes: ['read', 'write'] })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('Key created!', 'success');
                    prompt('Copy your API key (won\'t be shown again):', data.api_key);
                    loadApiKeys();
                } else {
                    showToast(data.error || 'Failed', 'error');
                }
            } catch (err) {
                showToast('Failed to create key', 'error');
            }
        }
        
        async function revokeKey(keyId) {
            if (!confirm('Revoke this key?')) return;
            
            try {
                const response = await fetch(`/dashboard/api-keys/${keyId}`, { method: 'DELETE' });
                const data = await response.json();
                
                if (data.success) {
                    showToast('Key revoked', 'success');
                    loadApiKeys();
                } else {
                    showToast(data.error || 'Failed', 'error');
                }
            } catch (err) {
                showToast('Failed to revoke', 'error');
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
            loadApiKeys();
        });
    </script>
</body>
</html>
