<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vaults - Context Foundry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_bust }}">
    <style>
        .vault-page {
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 32px;
        }
        
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        
        .vault-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .vault-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        
        .create-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: var(--radius-md);
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        
        .vaults-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .vault-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .vault-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.1);
        }
        
        .vault-card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .vault-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-primary);
            flex-shrink: 0;
        }
        
        .vault-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .vault-slug {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .vault-stats {
            display: flex;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        
        .vault-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .vault-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-primary);
        }
        
        .vault-stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        .empty-state {
            text-align: center;
            padding: 64px 32px;
            color: var(--text-muted);
        }
        
        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .empty-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .empty-text {
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .user-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 16px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-name {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .logout-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            border-color: var(--accent-error);
            color: var(--accent-error);
        }
        
        .content-wrapper {
            margin-top: 56px;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px;
        }
    </style>
</head>
<body>
    <div class="user-bar">
        <a href="/app" class="logo">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span class="logo-text">Context Foundry</span>
        </a>
        <div class="user-info">
            <span class="user-name">{{ user_name }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>
    
    <div class="content-wrapper">
        <div class="vault-page">
            <div class="vault-header">
                <div>
                    <h1 class="vault-title">My Vaults</h1>
                    <p class="vault-subtitle">Organize your knowledge into isolated spaces</p>
                </div>
                <a href="/app/new" class="create-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Create New Vault
                </a>
            </div>
            
            <div id="vaultsContainer" class="loading">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>
    
    <script>
        async function loadVaults() {
            const container = document.getElementById('vaultsContainer');
            
            try {
                const response = await fetch('/api/vaults');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Failed to load vaults');
                }
                
                if (data.vaults.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                    <path d="M2 17l10 5 10-5"/>
                                    <path d="M2 12l10 5 10-5"/>
                                </svg>
                            </div>
                            <h2 class="empty-title">No vaults yet</h2>
                            <p class="empty-text">Create your first vault to start organizing your knowledge</p>
                            <a href="/app/new" class="create-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                                Create Your First Vault
                            </a>
                        </div>
                    `;
                    return;
                }
                
                container.className = 'vaults-grid';
                container.innerHTML = data.vaults.map(vault => {
                    const updatedAt = vault.updated_at ? new Date(vault.updated_at).toLocaleDateString() : 'Never';
                    return `
                        <div class="vault-card" onclick="window.location.href='/app/${vault.id}'">
                            <div class="vault-card-header">
                                <div class="vault-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                        <path d="M2 17l10 5 10-5"/>
                                        <path d="M2 12l10 5 10-5"/>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="vault-name">${escapeHtml(vault.name)}</h3>
                                    <span class="vault-slug">${escapeHtml(vault.slug)}</span>
                                </div>
                            </div>
                            <div class="vault-stats">
                                <div class="vault-stat">
                                    <span class="vault-stat-value">${vault.document_count || 0}</span>
                                    <span class="vault-stat-label">Documents</span>
                                </div>
                                <div class="vault-stat">
                                    <span class="vault-stat-value">${updatedAt}</span>
                                    <span class="vault-stat-label">Last Updated</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Failed to load vaults:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="color: var(--accent-error);">Failed to load vaults. Please try again.</p>
                    </div>
                `;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadVaults();
    </script>
</body>
</html>
