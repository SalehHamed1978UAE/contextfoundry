<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vault - Context Foundry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_bust }}">
    <style>
        .vault-page {
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .create-form-container {
            width: 100%;
            max-width: 480px;
        }
        
        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--accent-primary);
        }
        
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
        
        .form-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .form-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
        }
        
        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        
        .form-error {
            font-size: 12px;
            color: var(--accent-error);
            margin-top: 8px;
            display: none;
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        
        .btn-primary {
            flex: 1;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: var(--radius-md);
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            padding: 14px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }
        
        .user-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 16px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-name {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .logout-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .logout-btn:hover {
            border-color: var(--accent-error);
            color: var(--accent-error);
        }
        
        .content-wrapper {
            margin-top: 56px;
        }
    </style>
</head>
<body>
    <div class="user-bar">
        <a href="/app" class="logo">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span class="logo-text">Context Foundry</span>
        </a>
        <div class="user-info">
            <span class="user-name">{{ user_name }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>
    
    <div class="content-wrapper">
        <div class="vault-page">
            <div class="create-form-container">
                <a href="/app" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back to Vaults
                </a>
                
                <div class="form-card">
                    <h1 class="form-title">Create a New Vault</h1>
                    <p class="form-subtitle">A vault is an isolated space for your documents and knowledge graph</p>
                    
                    <form id="createVaultForm">
                        <div class="form-group">
                            <label for="vaultName" class="form-label">Vault Name</label>
                            <input 
                                type="text" 
                                id="vaultName" 
                                name="name"
                                class="form-input" 
                                placeholder="e.g., My Project, Company Docs, Research..."
                                maxlength="100"
                                required
                                autofocus
                            >
                            <p class="form-hint">Choose a descriptive name for your vault</p>
                            <p id="formError" class="form-error"></p>
                        </div>
                        
                        <div class="form-actions">
                            <a href="/app" class="btn-secondary">Cancel</a>
                            <button type="submit" id="submitBtn" class="btn-primary">
                                Create Vault
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('createVaultForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorEl = document.getElementById('formError');
        const nameInput = document.getElementById('vaultName');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            
            if (!name) {
                showError('Please enter a vault name');
                return;
            }
            
            if (name.length < 2) {
                showError('Vault name must be at least 2 characters');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            hideError();
            
            try {
                const response = await fetch('/api/vaults', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to create vault');
                }
                
                window.location.href = `/app/${data.vault.id}`;
                
            } catch (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Vault';
            }
        });
        
        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            nameInput.style.borderColor = 'var(--accent-error)';
        }
        
        function hideError() {
            errorEl.style.display = 'none';
            nameInput.style.borderColor = 'var(--border-color)';
        }
        
        nameInput.addEventListener('input', hideError);
    </script>
</body>
</html>
