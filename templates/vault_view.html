<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault - Context Foundry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_bust }}">
    <style>
        .vault-layout {
            display: flex;
            height: 100vh;
            background: var(--bg-primary);
        }
        
        .vault-sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .vault-name-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .vault-icon-sm {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-primary);
        }
        
        .vault-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .sidebar-nav {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .nav-item.active {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-primary);
        }
        
        .file-tree-section {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            margin-bottom: 8px;
        }
        
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        
        .upload-btn {
            padding: 6px 10px;
            background: transparent;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .upload-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .file-icon {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }
        
        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .file-status.completed { background: var(--accent-success); }
        .file-status.processing { background: var(--accent-warning); }
        .file-status.failed { background: var(--accent-error); }
        .file-status.pending { background: var(--text-muted); }
        
        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .main-header {
            height: 56px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .main-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .user-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-name {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .settings-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .settings-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-secondary);
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow: hidden;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 16px;
        }
        
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
        }
        
        .empty-chat-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        .empty-chat-title {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .chat-input-container {
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        
        .chat-input::placeholder {
            color: var(--text-muted);
        }
        
        .send-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: var(--radius-sm);
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .drop-zone {
            border: 2px dashed transparent;
            border-radius: var(--radius-lg);
            transition: all 0.2s;
        }
        
        .drop-zone.drag-over {
            border-color: var(--accent-primary);
            background: rgba(6, 182, 212, 0.05);
        }
        
        .empty-files {
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        
        .drop-hint {
            margin-top: 8px;
            font-size: 11px;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="vault-layout">
        <div class="vault-sidebar">
            <div class="sidebar-header">
                <div class="vault-name-header">
                    <div class="vault-icon-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="vault-title" id="vaultName">Loading...</span>
                </div>
            </div>
            
            <div class="sidebar-nav">
                <a href="/app/{{ vault_id }}" class="nav-item active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    Chat
                </a>
                <a href="/app/{{ vault_id }}/dashboard" class="nav-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                    Knowledge Graph
                </a>
                <a href="/app/{{ vault_id }}/command-center" class="nav-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <path d="M8 12h8"/>
                        <path d="M12 8v8"/>
                    </svg>
                    Command Center
                </a>
            </div>
            
            <div class="file-tree-section">
                <div class="section-header">
                    <span class="section-title">Documents</span>
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        + Upload
                    </button>
                </div>
                <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.txt,.md">
                <div id="fileList" class="file-list">
                    <div class="empty-files">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 8px;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <div>No documents yet</div>
                        <div class="drop-hint">Drag & drop files here</div>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <a href="/app" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    All Vaults
                </a>
            </div>
        </div>
        
        <div class="main-content">
            <div class="main-header">
                <span class="main-title">Chat with your knowledge</span>
                <div class="user-actions">
                    <span class="user-name">{{ user_name }}</span>
                    <a href="/app/{{ vault_id }}/settings" class="settings-btn">Settings</a>
                </div>
            </div>
            
            <div class="chat-container drop-zone" id="dropZone">
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-chat">
                        <div class="empty-chat-icon">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                                <path d="M12 17h.01"/>
                            </svg>
                        </div>
                        <h3 class="empty-chat-title">Ask anything about your documents</h3>
                        <p>Upload documents and ask questions to explore your knowledge graph</p>
                    </div>
                </div>
                
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea 
                            class="chat-input" 
                            id="chatInput"
                            placeholder="Ask a question about your documents..."
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const vaultId = "{{ vault_id }}";
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        
        async function loadVaultInfo() {
            try {
                const response = await fetch(`/api/vaults/${vaultId}`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('vaultName').textContent = data.vault.name;
                    document.title = `${data.vault.name} - Context Foundry`;
                }
            } catch (error) {
                console.error('Failed to load vault info:', error);
            }
        }
        
        async function loadDocuments() {
            try {
                const response = await fetch(`/api/documents?page=1&per_page=100`);
                const data = await response.json();
                
                const fileList = document.getElementById('fileList');
                
                if (!data.documents || data.documents.length === 0) {
                    return;
                }
                
                fileList.innerHTML = data.documents.map(doc => `
                    <div class="file-item" data-id="${doc.id}">
                        <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span class="file-name">${escapeHtml(doc.original_filename || doc.filename || 'Unknown')}</span>
                        <span class="file-status ${doc.status}"></span>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Failed to load documents:', error);
            }
        }
        
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            sendBtn.disabled = !this.value.trim();
        });
        
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (this.value.trim()) {
                    sendMessage();
                }
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;
        }
        
        fileInput.addEventListener('change', handleFileUpload);
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length) {
                uploadFiles(e.dataTransfer.files);
            }
        });
        
        function handleFileUpload(e) {
            if (e.target.files.length) {
                uploadFiles(e.target.files);
            }
        }
        
        async function uploadFiles(files) {
            const formData = new FormData();
            for (const file of files) {
                formData.append('files', file);
            }
            
            try {
                const response = await fetch('/api/documents/upload/multi', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.success || data.queued) {
                    loadDocuments();
                }
            } catch (error) {
                console.error('Upload failed:', error);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadVaultInfo();
        loadDocuments();
    </script>
</body>
</html>
