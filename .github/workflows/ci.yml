name: Context Foundry CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: context_foundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Set up test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/context_foundry_test
        run: |
          psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run DTL Smoke Tests (inline-only)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/context_foundry_test
          TESTING: "true"
          DTL_SMOKE_MODE: "1"
        run: |
          python -m pytest tests/test_dtl_core.py::TestSmoke -v --tb=short -m smoke

      - name: Run Contract Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/context_foundry_test
          TESTING: "true"
        run: |
          python -m pytest tests/contracts/ -v --tb=short

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/context_foundry_test
          TESTING: "true"
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Run All E2E Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/context_foundry_test
          TESTING: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pytest tests/e2e/ -v --tb=short --timeout=300

      - name: Generate Coverage Report
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/context_foundry_test
          TESTING: "true"
        run: |
          python -m pytest tests/contracts/ tests/integration/ --cov=src/context_foundry --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: |
          ruff check src/ tests/ --output-format=github || true

      - name: Run type checking
        run: |
          mypy src/context_foundry --ignore-missing-imports || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -ll || true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check || true
