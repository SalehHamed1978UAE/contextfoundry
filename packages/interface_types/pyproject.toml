[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interface-types"
version = "1.0.0"
description = "Shared interface types between Platform Foundation and Context Foundry Brain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
